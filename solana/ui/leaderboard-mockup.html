<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>grindtokens — leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root { --ease: cubic-bezier(0.23, 1, 0.32, 1); }
  html[data-theme="dark"] {
    --bg: #0d0d10; --panel: #141417; --panel-2: #1a1a1e;
    --line: rgba(255,255,255,.08);
    --text: #f2f2f0; --dim: #8a8a90; --faint: #84848c;
    --accent: #7ee787; --accent-dim: rgba(126,231,135,.12);
    --gold: #e8b93e; --gold-deep: #e8b93e;
    --red: #f87171;
    --nav: rgba(20,20,23,.85);
    --pill-primary-bg: #f2f2f0; --pill-primary-text: #0d0d10;
    --shadow: 0 18px 44px rgba(0,0,0,.35);
  }
  html[data-theme="light"] {
    --bg: #f4efe4; --panel: #fdfbf4; --panel-2: #ece5d2;
    --line: rgba(20,20,18,.12);
    --text: #141412; --dim: #5a574c; --faint: #8a877a;
    --accent: #159a52; --accent-dim: rgba(21,154,82,.12);
    --gold: #e8b93e; --gold-deep: #9a6b12;
    --red: #c0392b;
    --nav: rgba(253,251,244,.88);
    --pill-primary-bg: #141412; --pill-primary-text: #f4efe4;
    --shadow: 0 18px 44px rgba(20,20,18,.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    min-height: 100svh;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .g-demo {
    font-size: 11px; font-weight: 700; opacity: .55;
    border: 1px solid currentColor; border-radius: 4px;
    padding: 3px 6px; letter-spacing: .06em; white-space: nowrap;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  .enter { animation: rise .28s var(--ease) both; animation-delay: var(--d, 0ms); }

  .page { max-width: 1080px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px) 64px; }

  /* ---------- floating pill navbar ---------- */
  .navwrap {
    position: sticky; top: 12px; z-index: 50;
    display: flex; justify-content: center;
    padding: 12px clamp(16px, 4vw, 32px) 0;
    pointer-events: none;
  }
  .navbar {
    pointer-events: auto;
    display: flex; align-items: center; gap: 10px;
    background: var(--nav);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 8px 8px 20px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    max-width: 100%;
  }
  .wordmark { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .mark { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 12px var(--accent-dim); flex-shrink: 0; }
  .live-pill {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 16px; min-height: 44px;
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .live-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex-shrink: 0; }

  /* ---------- title ---------- */
  .hero { padding: 32px 0 8px; }
  .h1 {
    font-family: "Anton", "Arial Narrow", sans-serif;
    font-size: clamp(48px, 7vw, 96px);
    line-height: .95; letter-spacing: .005em; text-transform: uppercase;
  }
  /* measured: "LEADERBOARD" in Anton = 484px @ 48px (10.08 px/px);
     9vw keeps it inside (viewport - 32px padding) at 320px and up */
  @media (max-width: 600px) {
    .h1 { font-size: 9vw; }
  }
  .sub { margin-top: 12px; font-size: 15px; color: var(--dim); font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ---------- controls ---------- */
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
    margin: 20px 0 16px;
  }
  .tabs {
    display: flex; background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px;
  }
  .tabs button {
    border: none; background: transparent; color: var(--dim);
    font-size: 14px; font-weight: 700; font-family: inherit;
    padding: 0 22px; min-height: 44px; border-radius: 999px; cursor: pointer;
    transition: background-color .15s ease-out, color .15s ease-out;
    white-space: nowrap;
  }
  .tabs button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
  .search {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 0 20px; min-height: 52px; min-width: min(300px, 100%);
  }
  .search svg { flex-shrink: 0; opacity: .6; }
  .search input {
    border: none; background: transparent; color: var(--text);
    font-size: 15px; font-family: inherit; font-weight: 600;
    height: 50px; width: 100%; outline: none;
  }
  .search input::placeholder { color: var(--faint); }
  .match-note { font-size: 13px; color: var(--faint); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- my rank pinned card ---------- */
  .myrank {
    border: 1px solid rgba(232,185,62,.55);
    background: linear-gradient(135deg, rgba(232,185,62,.10), rgba(232,185,62,.03));
    border-radius: 20px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }
  .myrank .tag {
    font-size: 11px; font-weight: 800; letter-spacing: .12em;
    color: var(--gold-deep); margin-bottom: 10px;
  }
  .myrow {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: 16px; min-width: 0;
  }

  /* ---------- rows as cards ---------- */
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 20px;
    min-width: 0;
  }
  .rank-badge {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .rank-1 { background: var(--gold); color: #141410; box-shadow: 0 0 18px rgba(232,185,62,.45); }
  .rank-2 { background: #c9ccd4; color: #141412; }
  .rank-3 {
    background: #cd7f32; color: #141410;
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    border-radius: 0; width: 48px; height: 48px;
  }
  .rank-n { background: var(--panel-2); border: 1px solid var(--line); color: var(--dim); border-radius: 999px; font-size: 13px; }
  .who { min-width: 0; }
  .who .handle { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
  .who-sub { font-size: 12px; color: var(--faint); font-weight: 600; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-sub .mono { color: var(--gold-deep); }
  .who-sub .nowrap { white-space: nowrap; }
  /* One dominant element per row: the hits pill. Everything else is quiet text. */
  .pill-hits {
    display: inline-flex; align-items: center; gap: 10px;
    border-radius: 999px; padding: 12px 20px;
    background: var(--pill-primary-bg); color: var(--pill-primary-text);
    font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .pills { display: contents; }

  .empty {
    border: 1px dashed var(--line); border-radius: 18px;
    padding: 32px 20px; text-align: center;
    color: var(--dim); font-weight: 600; font-size: 15px;
  }
  .empty .sub2 { font-size: 13px; color: var(--faint); margin-top: 6px; font-weight: 600; }

  /* ---------- pagination ---------- */
  .pager { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  .pager button {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    font-size: 14px; font-weight: 800; font-family: inherit; font-variant-numeric: tabular-nums;
    cursor: pointer; transition: background-color .15s ease-out, color .15s ease-out, border-color .15s ease-out;
  }
  .pager button[aria-current="page"] { background: var(--text); color: var(--bg); border-color: transparent; }
  .pager button:not([aria-current="page"]):hover { border-color: var(--faint); color: var(--text); }

  .foot { margin-top: 40px; text-align: center; font-size: 12px; color: var(--faint); font-weight: 600; }

  /* ---------- responsive ---------- */
  @media (max-width: 860px) {
    .pill-hits { font-size: 17px; padding: 10px 16px; }
    .who-sub { white-space: normal; }
  }
  @media (max-width: 520px) {
    .wordmark span.wt { display: none; }
    .live-pill .lp-label { display: none; }
    .live-pill { padding: 10px 14px; }
    .hero { padding-top: 28px; }
    .search { min-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .enter { animation: none; }
    body { transition: none; }
  }
</style>
</head>
<body>

<div class="navwrap">
  <nav class="navbar" aria-label="Leaderboard navigation">
    <div class="wordmark"><span class="mark"></span><span class="wt">grindtokens</span></div>
    <div class="live-pill"><span class="dot"></span><span id="netCount">48,211</span><span class="lp-label">&nbsp;grinders online</span>&nbsp;<span class="g-demo">demo</span></div>
  </nav>
</div>

<div class="page">
  <div class="hero">
    <h1 class="h1 enter" style="--d:0ms">Leaderboard</h1>
    <p class="sub enter" style="--d:60ms">Top grinders by hits <span class="g-demo">demo</span></p>
  </div>

  <div class="controls enter" style="--d:120ms">
    <div class="tabs" role="group" aria-label="Time range">
      <button id="tabAll" aria-pressed="true">All time</button>
      <button id="tabWeek" aria-pressed="false">This week</button>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.8"/><line x1="11" y1="11" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="Search grinders…" aria-label="Search grinders by handle" autocomplete="off">
    </label>
  </div>
  <div class="match-note" id="matchNote" hidden></div>

  <div class="myrank enter" id="myRank" style="--d:180ms" hidden>
    <div class="tag">YOUR RANK</div>
    <div id="myRankRow"></div>
  </div>

  <div class="rows" id="rows" aria-live="polite"></div>

  <div class="pager" id="pager" role="navigation" aria-label="Leaderboard pages"></div>

  <div class="foot">Demo data &middot; ranks are illustrative</div>
</div>

<script>
"use strict";
/* ---------- deterministic demo data ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const HANDLES = [
  'hashhound', 'silicasaint', 'nonce_ninja', 'grindset', 'vanityvault',
  'keysmith', 'blocksmith', 'merkle_mike', 'deepnonce', 'shardrunner',
  'eclipse_miner', 'glyphgrinder', 'torque_88', 'quietnode', 'velvetnonce',
  'ironledger', 'pixeldrift', 'coldstart', 'loworbit', 'mintmark',
  'zerograv', 'satoracle', 'bitbadger', 'hexhavoc'
];
const PATTERNS = [
  { p: 'Gr1nd', odds: '1 in 916M' },
  { p: 'GR1D', odds: '1 in 11M' },
  { p: '9Xk2', odds: '1 in 11M' },
  { p: 'grnd', odds: '1 in 11M' },
  { p: 'G7xQ', odds: '1 in 11M' },
  { p: '7K2', odds: '1 in 195K' }
];
function buildSet(seed, scale) {
  const rnd = mulberry32(seed);
  return HANDLES.map((handle, i) => {
    const base = 48200 * Math.pow(0.82, i);
    const hits = Math.max(280, Math.round(base * scale * (0.92 + rnd() * 0.16)));
    const pat = PATTERNS[Math.min(PATTERNS.length - 1, Math.floor(i / 4 + rnd() * 1.4))];
    const deltaPool = [0, 0, 1, 1, 2, 3, -1, -2, 4, -3, 5, -4];
    return {
      handle,
      hits,
      rolls: Math.round(hits * (380000 + rnd() * 90000)),
      pattern: pat.p,
      odds: pat.odds,
      delta: deltaPool[Math.floor(rnd() * deltaPool.length)]
    };
  }).sort((a, b) => b.hits - a.hits);
}
const DATA = {
  all: buildSet(1337, 1),
  week: buildSet(4242, 0.11)
};
const ME = { handle: 'you', hits: 12, rolls: 4812044, pattern: '9Xk2', odds: '1 in 11M', delta: 2, rank: 1337 };

/* ---------- state ---------- */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const state = {
  tab: params.get('tab') === 'week' ? 'week' : 'all',
  q: params.get('q') || '',
  page: Math.max(1, parseInt(params.get('page') || '1', 10) || 1),
  animateNext: true
};
const PAGE_SIZE = 8;

/* ---------- element refs ---------- */
const rowsEl = document.getElementById('rows');
const pagerEl = document.getElementById('pager');
const matchNoteEl = document.getElementById('matchNote');
const myRankEl = document.getElementById('myRank');
const myRankRowEl = document.getElementById('myRankRow');
const searchInput = document.getElementById('searchInput');
const tabAll = document.getElementById('tabAll');
const tabWeek = document.getElementById('tabWeek');
const netCountEl = document.getElementById('netCount');

function fmt(n) { return Math.round(n).toLocaleString('en-US'); }

function rankBadge(rank) {
  if (rank === 1) return '<div class="rank-badge rank-1" aria-label="Rank 1">1</div>';
  if (rank === 2) return '<div class="rank-badge rank-2" aria-label="Rank 2">2</div>';
  if (rank === 3) return '<div class="rank-badge rank-3" aria-label="Rank 3">3</div>';
  return '<div class="rank-badge rank-n" aria-label="Rank ' + rank + '">' + rank + '</div>';
}
function rowHtml(g, rank, d) {
  return '<div class="row' + (state.animateNext && !REDUCED ? ' enter' : '') + '" style="--d:' + d + 'ms">' +
    rankBadge(rank) +
    '<div class="who"><div class="handle">' + g.handle + '</div>' +
      '<div class="who-sub"><span class="mono">' + g.pattern + '&hellip;</span> &middot; <span class="nowrap">' + g.odds + '</span></div></div>' +
    '<div class="pills">' +
      '<span class="pill-hits">' + fmt(g.hits) + ' <span class="g-demo">demo</span></span>' +
    '</div>' +
  '</div>';
}

/* ---------- render ---------- */
function currentRows() {
  const q = state.q.trim().toLowerCase();
  const all = DATA[state.tab];
  if (!q) return all;
  return all.filter(g => g.handle.toLowerCase().includes(q));
}
function render() {
  const list = currentRows();
  const searching = state.q.trim().length > 0;
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (state.page > pages) state.page = pages;
  const slice = searching ? list : list.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);

  // my-rank pinned card (always visible)
  myRankEl.hidden = false;
  myRankRowEl.innerHTML =
    '<div class="myrow">' +
    '<div class="rank-badge rank-n" aria-label="Rank 1337">1337</div>' +
    '<div class="who"><div class="handle">' + ME.handle + '</div>' +
      '<div class="who-sub"><span class="mono">' + ME.pattern + '&hellip;</span> &middot; <span class="nowrap">' + ME.odds + '</span></div></div>' +
    '<div class="pills">' +
      '<span class="pill-hits">' + fmt(ME.hits) + ' <span class="g-demo">demo</span></span>' +
    '</div></div>';

  // rows
  if (!slice.length) {
    rowsEl.innerHTML = '<div class="empty">No grinders match &ldquo;' + state.q.trim() + '&rdquo;<div class="sub2">Try a different handle</div></div>';
  } else {
    rowsEl.innerHTML = slice.map((g, i) =>
      rowHtml(g, searching ? DATA[state.tab].indexOf(g) + 1 : (state.page - 1) * PAGE_SIZE + i + 1, Math.min(i * 40, 320))
    ).join('');
  }
  state.animateNext = false;

  // match note + pager
  if (searching) {
    matchNoteEl.hidden = false;
    matchNoteEl.textContent = list.length + (list.length === 1 ? ' grinder matches' : ' grinders match') + ' \u201c' + state.q.trim() + '\u201d';
    pagerEl.innerHTML = '';
  } else {
    matchNoteEl.hidden = true;
    if (pages <= 1) {
      pagerEl.innerHTML = '';
    } else {
      let html = '';
      for (let p = 1; p <= pages; p++) {
        html += '<button data-page="' + p + '"' + (p === state.page ? ' aria-current="page"' : '') +
          ' aria-label="Page ' + p + '">' + p + '</button>';
      }
      pagerEl.innerHTML = html;
    }
  }

  // tab pressed states
  tabAll.setAttribute('aria-pressed', state.tab === 'all' ? 'true' : 'false');
  tabWeek.setAttribute('aria-pressed', state.tab === 'week' ? 'true' : 'false');
}

/* ---------- theme: no UI toggle; ?theme=light previews the light theme ---------- */
document.documentElement.setAttribute('data-theme', params.get('theme') === 'light' ? 'light' : 'dark');

/* ---------- tabs ---------- */
function setTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  state.page = 1;
  state.animateNext = !REDUCED;
  render();
  document.getElementById('rows').scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' });
}
tabAll.addEventListener('click', () => setTab('all'));
tabWeek.addEventListener('click', () => setTab('week'));

/* ---------- search (debounced) ---------- */
let searchT = 0;
searchInput.value = state.q;
searchInput.addEventListener('input', () => {
  clearTimeout(searchT);
  searchT = setTimeout(() => {
    state.q = searchInput.value;
    state.page = 1;
    render();
  }, 160);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { searchInput.value = ''; state.q = ''; state.page = 1; render(); }
});

/* ---------- pagination (delegated) ---------- */
pagerEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-page]');
  if (!btn) return;
  state.page = parseInt(btn.dataset.page, 10);
  state.animateNext = !REDUCED;
  render();
  window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
});

/* ---------- live net pill drift ---------- */
let net = 48211;
setInterval(() => {
  net += Math.floor((Math.random() - 0.45) * 14);
  netCountEl.textContent = fmt(net);
}, 1500);

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
